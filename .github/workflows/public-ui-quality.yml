name: Public UI quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:design-system
      - run: npm run typecheck
      - run: npm run build
